name: Publish course
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test LaTeX authoring
        run: python3 website/scripts/test-authoring.py
      - name: Test lesson handoff
        run: python3 website/scripts/test-add-lesson.py
      - name: Test conditional geometry model
        run: node website/scripts/test-conditional-geometry.cjs
      - name: Build from lesson sources
        run: node website/scripts/build.mjs
      - name: Validate pages and links
        run: python3 website/scripts/verify-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

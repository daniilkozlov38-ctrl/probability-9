<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">Круги Эйлера к задаче №284</title>
  <desc id="desc">В пространстве исходов a, b, c левый круг A содержит a и b, правый круг B содержит a и c. В пересечении находится только a. Вероятности: a — 0,1; b — 0,3; c — 0,6. Вероятность A равна 0,4, B — 0,7. Площади областей условные.</desc>
  <rect x="2" y="2" width="716" height="426" rx="18" fill="#fffaf4" stroke="#e7d4c3" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#594334" text-anchor="middle">
    <text x="360" y="38" font-size="20">Все исходы: Ω = {a, b, c}</text>
    <circle cx="280" cy="218" r="132" fill="#f6cfa7" fill-opacity="0.6" stroke="#bd8151" stroke-width="2"/>
    <circle cx="440" cy="218" r="132" fill="#eac0ae" fill-opacity="0.6" stroke="#b17b68" stroke-width="2"/>
    <text x="217" y="76" font-size="20">A = {a, b}</text>
    <text x="503" y="76" font-size="20">B = {a, c}</text>
    <text x="217" y="211" font-size="30" font-style="italic">b</text>
    <text x="217" y="245" font-size="21">0,3</text>
    <text x="360" y="211" font-size="30" font-style="italic">a</text>
    <text x="360" y="245" font-size="21">0,1</text>
    <text x="503" y="211" font-size="30" font-style="italic">c</text>
    <text x="503" y="245" font-size="21">0,6</text>
    <text x="217" y="380" font-size="20">P(A) = 0,4</text>
    <text x="503" y="380" font-size="20">P(B) = 0,7</text>
    <text x="360" y="410" font-size="15" fill="#806c5c">Площади областей не соответствуют вероятностям</text>
  </g>
</svg>
